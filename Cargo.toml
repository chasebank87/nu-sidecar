[workspace]
resolver = "2"
members = [
    "crates/sidecar-core",
    "crates/nu_plugin_bashify",
    "crates/nu_plugin_llmchat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nu-plugin = "=0.115.1"
nu-protocol = { version = "=0.115.1", features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
